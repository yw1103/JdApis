interface:
  display_name: "京东采购助手"
  short_description: "按需求筛选京东商品、核验评论和商家，并生成可审计的采购报告"
  default_prompt: "Use $jd-shopping-assistant to compare JD products against my requirements, confirm the finalist, and produce a complete shopping report."

dependencies:
  tools:
    - type: "mcp"
      value: "jd-apis"
      description: "JdApis MCP server for JD login, product research, reviews, cart status, and chat data"

policy:
  allow_implicit_invocation: true
