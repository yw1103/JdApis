# 在仓库根目录执行：
#   docker compose -f mcp_server/docker-compose.yml up -d --build
#
# 或在本目录：
#   docker compose up -d --build
#
# 默认映射 0.0.0.0:8765，外网 Cursor 填 http://公网IP:8765/sse（公网注意风险）。
# 登录态：仅写容器内 tmpfs，不挂载宿主机；容器内 MCP 登录，down 即丢。

services:
  jd-apis-mcp:
    build:
      # 相对本文件：无论在仓库根还是 mcp_server/ 下执行 compose，context 都是仓库根
      context: ..
      dockerfile: mcp_server/Dockerfile
      # 国内默认源已写在 Dockerfile；海外或自定义镜像站可取消注释覆盖：
      # args:
      #   APT_MIRROR: deb.debian.org
      #   PIP_INDEX_URL: https://pypi.org/simple
      #   PIP_TRUSTED_HOST: pypi.org
      #   NPM_REGISTRY: https://registry.npmjs.org
    image: jd-apis-mcp:latest
    container_name: jd-apis-mcp
    ports:
      - "${MCP_HOST:-0.0.0.0}:${MCP_PORT:-8765}:8765"
    environment:
      JDAPIS_AUTH_FILE: /tmp/jdapis/auth.json
    # 登录态与临时文件落在内存盘；docker compose down / 容器销毁后即丢失
    tmpfs:
      - /tmp/jdapis:size=32m,mode=1777
    restart: unless-stopped
